<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina niet gevonden — Koen Holman</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#010309">

<!-- A 404 is served at whatever URL the visitor mistyped, so relative asset
     paths cannot be trusted here. Everything this page needs is inline; the
     stylesheet below is a progressive enhancement that only lands when the
     site sits at the domain root. -->
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="/assets/fonts.css?v=16">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100dvh;
    background: #010309;
    color: #eaf4ff;
    font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: radial-gradient(125% 105% at 50% 0%, #050c1a 0%, #02060f 30%, #010309 54%, #000000 78%);
  }
  main { max-width: 560px; }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: rgba(180, 206, 228, 0.6);
  }
  h1 {
    margin: 18px 0 0;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: clamp(40px, 8vw, 72px);
    line-height: 1.02;
    color: #f4f7ff;
  }
  h1 em { font-style: italic; color: #7de0d2; }
  p {
    margin: 22px 0 30px;
    font-weight: 300;
    font-size: 17px;
    line-height: 1.6;
    color: rgba(228, 238, 250, 0.82);
  }
  a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 22px;
    border-radius: 12px;
    border: 1px solid rgba(125, 224, 210, 0.4);
    background: rgba(125, 224, 210, 0.1);
    color: #9ff0e2;
    text-decoration: none;
    font-size: 11.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    transition: background .25s;
  }
  a:hover { background: rgba(125, 224, 210, 0.18); }
  a:focus-visible { outline: 2px solid #9ff0e2; outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Fout 404</p>
    <h1>Deze pagina is er <em>niet</em></h1>
    <p>De link klopt niet meer, of hij heeft nooit bestaan. Ga terug naar de homepage — daar begint alles.</p>
    <a href="/">Naar de homepage &#8594;</a>
  </main>
</body>
</html>
